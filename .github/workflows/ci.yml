name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: marketflow
          POSTGRES_USER: marketflow
          POSTGRES_PASSWORD: marketflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_NAME: marketflow
      DB_USER: marketflow
      DB_PASSWORD: marketflow
      JWT_SECRET: segredo-usado-somente-no-ci

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e testar
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Montar a imagem Docker
        run: docker build -t marketflow:ci .